global:
  scrape_interval: 15s
  scrape_timeout: 10s
  scrape_protocols:
    - OpenMetricsText1.0.0
    - OpenMetricsText0.0.1
    - PrometheusText0.0.4
  # Store metric and label names with underscores (ssv_cl_sync_distance), as the
  # dashboard and alert rules expect. Without this, Prometheus 3 asks for UTF-8
  # names, and SSV Node v2.5.0 and older serve dotted names (ssv.cl.sync.distance).
  metric_name_escaping_scheme: underscores
  evaluation_interval: 15s

scrape_configs:
- job_name: ssv
  metrics_path: /metrics
  static_configs:
    - targets:
      - "ssv-node:15000"
  relabel_configs:
    - target_label: pod
      replacement: ssv-node-1

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager:9093'
